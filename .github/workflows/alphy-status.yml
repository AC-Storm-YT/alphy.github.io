name: Alphy Status Monitor

on:
  workflow_run:
    workflows: ["Alphy Lockdown Manager"]
    types:
      - completed
  workflow_dispatch:
  push:
    paths:
      - 'lockdown.txt'
      - 'version.txt'
      - 'rlsteambuild.txt'
      - 'supportedbuild'
      - 'gameversion.txt'

permissions:
  contents: write

concurrency:
  group: alphy-status-monitor
  cancel-in-progress: false

jobs:
  update_discord_status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read files and update Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE_ID: "1503500652758827182"
        run: |
          STATUS=$(cat lockdown.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')

          if [ -f "version.txt" ]; then
            VERSION=$(cat version.txt | tr -d '\n' | tr -d '\r')
          else
            VERSION="Unknown"
          fi

          if [ -f "rlsteambuild.txt" ]; then
            RL_STEAM=$(cat rlsteambuild.txt | tr -d '\n' | tr -d '\r')
          else
            RL_STEAM="Unknown"
          fi

          if [ -f "supportedbuild" ]; then
            SUPP_BUILD=$(cat supportedbuild | tr -d '\n' | tr -d '\r')
          else
            SUPP_BUILD="Unknown"
          fi

          if [ -f "gameversion.txt" ]; then
            GAME_VERSION=$(cat gameversion.txt | tr -d '\n' | tr -d '\r')
          else
            GAME_VERSION="$RL_STEAM"
          fi

          if [ "$STATUS" == "true" ]; then
            # Lockdown is TRUE -> MAINTENANCE/RED
            APP_STATUS="MAINTENANCE"
            COLOR=16711680 # Red
            DETAIL="The mod network is temporarily offline for upgrades."
            IMAGE_URL="https://raw.githubusercontent.com/AC-Storm-YT/alphy.github.io/refs/heads/main/status/Alphy_Maintenance_Banner.png"
          elif [ "$STATUS" == "false" ]; then
            # Lockdown is FALSE -> OPERATIONAL/GREEN
            APP_STATUS="OPERATIONAL"
            COLOR=65280 # Green
            DETAIL="All systems are running normally. Happy modding!"
            IMAGE_URL="https://raw.githubusercontent.com/AC-Storm-YT/alphy.github.io/refs/heads/main/status/Alphy_Operational_Banner.png"
          elif [ "$STATUS" == "update" ]; then
            # Lockdown is UPDATE -> UPDATE REQUIRED/ORANGE
            APP_STATUS="UPDATING"
            COLOR=16753920 # Orange
            DETAIL="Alphy requires an update to support the latest Rocket League patch."
            IMAGE_URL="https://raw.githubusercontent.com/AC-Storm-YT/alphy.github.io/refs/heads/main/status/Alphy_Updating_Banner.png"
          else
            APP_STATUS="UNKNOWN"
            COLOR=8421504 # Gray
            DETAIL="lockdown.txt was updated, but the status is unknown: $STATUS"
            IMAGE_URL=""
          fi

          PRODUCT=$'Rocket League\nAlphy'
          LATEST_BUILD="$RL_STEAM"
          SUPPORTED_BUILD="$SUPP_BUILD"
          THUMBNAIL_URL="https://raw.githubusercontent.com/AC-Storm-YT/alphy.github.io/refs/heads/main/status/rl_logo.jpg"

          PAYLOAD=$(jq -n \
            --arg product "$PRODUCT" \
            --arg app "$APP_STATUS" \
            --arg game "$GAME_VERSION" \
            --arg latest "$LATEST_BUILD" \
            --arg supported "$SUPPORTED_BUILD" \
            --arg message "$DETAIL" \
            --arg thumbnail "$THUMBNAIL_URL" \
            --arg image "$IMAGE_URL" \
            --arg footer "Alphy Version: $VERSION" \
            --argjson color "$COLOR" \
            '{
              embeds: [({
                color: $color,
                thumbnail: {url: $thumbnail},
                fields: [
                  {name: "Product", value: $product, inline: true},
                  {name: "App Status", value: $app, inline: true},
                  {name: "Game Version", value: $game, inline: true},
                  {name: "Latest Build", value: $latest, inline: true},
                  {name: "Supported Build", value: $supported, inline: true},
                  {name: "Status Message", value: $message, inline: false}
                ],
                footer: {text: $footer}
              } + (if $image != "" then {image: {url: $image}} else {} end))]
            }')

          curl -H "Content-Type: application/json" \
          -X PATCH \
          -d "$PAYLOAD" \
          "$WEBHOOK_URL/messages/$MESSAGE_ID"

      - name: Announce update or maintenance changes
        env:
          ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          ANNOUNCEMENT_PING: "@everyone"
          STATUS_CHANNEL_ID: "1503498683373584557"
        run: |
          set -euo pipefail

          STATE_FILE="announcement-state.txt"
          STATUS=$(cat lockdown.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          LAST_STATUS=""

          if [ -f "$STATE_FILE" ]; then
            LAST_STATUS=$(cat "$STATE_FILE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          fi

          echo "Current status: $STATUS"
          echo "Last announced status: ${LAST_STATUS:-none}"

          if [ "$STATUS" = "$LAST_STATUS" ]; then
            echo "No announcement needed. This status was already handled."
            exit 0
          fi

          SHOULD_ANNOUNCE="false"
          ANNOUNCE_TITLE=""
          ANNOUNCE_DESCRIPTION=""
          ANNOUNCE_COLOR=8421504

          if [ "$STATUS" = "update" ]; then
            SHOULD_ANNOUNCE="true"
            ANNOUNCE_TITLE="Alphy currently requires an update before it can function properly."
            ANNOUNCE_COLOR=16753920
            ANNOUNCE_DESCRIPTION=$(cat <<EOF
A new Rocket League update may have been detected, and Alphy needs to be checked before we put it back online.

User satisfaction and stability are our top priorities, so we are verifying everything before restoring service.

See the status channel: <#$STATUS_CHANNEL_ID>

THIS IS AN AUTOMATED MESSAGE FROM ALPHY SYSTEM.
EOF
)
          elif [ "$STATUS" = "true" ]; then
            SHOULD_ANNOUNCE="true"
            ANNOUNCE_TITLE="Alphy is currently under maintenance."
            ANNOUNCE_COLOR=16711680
            ANNOUNCE_DESCRIPTION=$(cat <<EOF
We are temporarily taking the app offline while we perform checks, updates, or backend maintenance.

User satisfaction and stability are our top priorities, so we will restore service as soon as everything is verified.

See the status channel: <#$STATUS_CHANNEL_ID>

THIS IS AN AUTOMATED MESSAGE FROM ALPHY SYSTEM.
EOF
)
          fi

          if [ "$SHOULD_ANNOUNCE" = "true" ]; then
            if [ -z "${ANNOUNCEMENTS_WEBHOOK_URL:-}" ]; then
              echo "::warning::DISCORD_ANNOUNCEMENTS_WEBHOOK is not set. Announcement was not sent, and state was not updated."
              exit 0
            fi

            PAYLOAD=$(jq -n \
              --arg content "$ANNOUNCEMENT_PING" \
              --arg title "$ANNOUNCE_TITLE" \
              --arg description "$ANNOUNCE_DESCRIPTION" \
              --argjson color "$ANNOUNCE_COLOR" \
              '{
                content: $content,
                allowed_mentions: {parse: ["everyone"]},
                embeds: [{
                  title: $title,
                  description: $description,
                  color: $color
                }]
              }')

            curl -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$ANNOUNCEMENTS_WEBHOOK_URL"
          else
            echo "Status does not require an announcement. Updating announcement state only."
          fi

          echo "$STATUS" > "$STATE_FILE"

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$STATE_FILE"

          if ! git diff --staged --quiet; then
            git commit -m "chore: update last announced Alphy status"
            git push
          else
            echo "Announcement state is already up to date."
          fi