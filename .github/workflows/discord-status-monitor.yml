name: Alphy Status Monitor

on:
  push:
    branches:
      - main
    paths:
      - 'lockdown.txt'
      - 'version.txt'
      - 'rlsteambuild.txt'
      - 'supportedbuild'

jobs:
  update_discord_status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read files and update Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE_ID: "1503500652758827182"
        run: |
          STATUS=$(cat lockdown.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          
          if [ -f "version.txt" ]; then
            VERSION=$(cat version.txt | tr -d '\n' | tr -d '\r')
          else
            VERSION="Unknown"
          fi

          if [ -f "rlsteambuild.txt" ]; then
            RL_STEAM=$(cat rlsteambuild.txt | tr -d '\n' | tr -d '\r')
          else
            RL_STEAM="Unknown"
          fi

          if [ -f "supportedbuild" ]; then
            SUPP_BUILD=$(cat supportedbuild | tr -d '\n' | tr -d '\r')
          else
            SUPP_BUILD="Unknown"
          fi

          if [ "$STATUS" == "true" ]; then
            TITLE="⚠️ **MAINTENANCE**"
            COLOR=16711680 # Red
            SUBTITLE="__System Status__"
            DETAIL="*The mod network is temporarily offline for upgrades.*"
          elif [ "$STATUS" == "false" ]; then
            TITLE="✅ **OPERATIONAL**"
            COLOR=65280 # Green
            SUBTITLE="__System Status__"
            DETAIL="*All systems are running normally. Happy modding!*"
          elif [ "$STATUS" == "update" ]; then
            TITLE="🔄 **UPDATE REQUIRED**"
            COLOR=16753920 # Orange
            SUBTITLE="__System Status__"
            DETAIL="*Alphy requires an update to support the latest Rocket League patch.*\n\n**Supported Build:** $SUPP_BUILD\n**Latest Build:** $RL_STEAM"
          else
            TITLE="❓ **UNKNOWN**"
            COLOR=8421504 # Gray
            SUBTITLE="__System Status__"
            DETAIL="lockdown.txt was updated, but the status is unknown: $STATUS"
          fi
          
          DESCRIPTION="$TITLE\n\n# $SUBTITLE\n\n$DETAIL\n\n\n\n**Alphy Version:** $VERSION"
          
          curl -H "Content-Type: application/json" \
          -X PATCH \
          -d "{\"embeds\": [{\"description\": \"$DESCRIPTION\", \"color\": $COLOR}]}" \
          "$WEBHOOK_URL/messages/$MESSAGE_ID"